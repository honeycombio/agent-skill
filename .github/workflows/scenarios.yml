name: Scenario Tests

on:
  workflow_dispatch:
    inputs:
      comparison:
        description: "Run with/without plugin comparison"
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * 1,4"  # Mon/Thu 6am UTC

jobs:
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure Honeycomb MCP
        env:
          HONEYCOMB_API_KEY: ${{ secrets.HONEYCOMB_API_KEY }}
        run: |
          python3 -c "
          import json, os
          key = os.environ['HONEYCOMB_API_KEY']
          cwd = os.getcwd()
          config = {
              'mcpServers': {
                  'honeycomb': {
                      'command': 'node',
                      'args': [f'{cwd}/tests/scenarios/mcp-http-proxy.mjs', key]
                  }
              }
          }
          with open('.mcp.json', 'w') as f:
              json.dump(config, f, indent=2)
          "
          echo "Generated .mcp.json (key redacted):"
          python3 -c "
          import json
          c = json.load(open('.mcp.json'))
          c['mcpServers']['honeycomb']['args'][1] = '***'
          print(json.dumps(c, indent=2))
          "

      - name: Verify MCP connectivity
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "=== Verifying Claude can reach MCP server ==="
          claude -p "Call get_workspace_context and tell me the team name." \
            --output-format stream-json --verbose \
            --mcp-config .mcp.json \
            --max-turns 2 \
            --allowedTools "mcp__honeycomb__get_workspace_context" 2>&1 | tee mcp-verify.ndjson
          echo ""
          echo "=== Checking MCP status ==="
          if grep -q '"status":"failed"' mcp-verify.ndjson; then
            echo "FATAL: MCP server failed to connect"
            grep -o '"mcp_servers":\[[^]]*\]' mcp-verify.ndjson || true
            exit 1
          fi
          if grep -q '"status":"needs-auth"' mcp-verify.ndjson; then
            echo "FATAL: MCP server needs auth"
            exit 1
          fi
          if ! grep -q 'tool_use' mcp-verify.ndjson; then
            echo "FATAL: No tool_use blocks — MCP tools not available"
            exit 1
          fi
          echo "MCP connectivity verified"

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Run scenario tests
        if: ${{ !inputs.comparison }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m pytest tests/scenarios/test_scenarios.py -v -s --tb=short -k "not comparison" 2>&1 | tee scenario-output.txt

      - name: Run comparison tests
        if: ${{ inputs.comparison }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m pytest tests/scenarios/test_scenarios.py -v -s --tb=short -m comparison 2>&1 | tee scenario-output.txt

      - name: Upload scenario output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-output
          path: |
            tests/scenarios/output/
            mcp-verify.ndjson
          retention-days: 14

      - name: Post summary
        if: always()
        run: |
          echo '## Scenario Test Results' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -50 scenario-output.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No output captured" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
