scenarios:
  # === Core comparison scenarios ===
  # Each scenario tests a distinct plugin capability against bare MCP baseline.
  # Kept to ~7 scenarios to balance coverage with CI runtime (~50 min for full suite).

  # --- Investigation workflows ---

  - id: investigation-cascading-failure
    name: "Full investigation from vague user report"
    comparison: true
    prompt: "Users are complaining that the site is broken — pages are timing out and checkout isn't working. Can you investigate in Honeycomb and figure out what's going on?"
    expected:
      required_tools: [get_workspace_context, run_query]
      recommended_tools: [get_service_map, run_bubbleup, get_trace]
      required_patterns:
        - '"op":\s*"(HEATMAP|P99|P95|P90)"'
        - '"column":\s*"error"'
      anti_patterns:
        - '"op":\s*"AVG",\s*"column":\s*"duration'
      tool_ordering:
        - [get_workspace_context, run_query]
    expected_skills:
      - production-investigation
      - query-patterns
    config:
      max_turns: 20
      timeout_ms: 300000

  - id: investigation-cross-service-errors
    name: "Cross-service error correlation using relational fields"
    comparison: true
    prompt: "The recommendation service is throwing database timeout errors — use Honeycomb to help me understand which user-facing endpoints are affected and how bad the impact is on real users."
    expected:
      required_tools: [get_workspace_context, run_query]
      recommended_tools: [get_trace, get_service_map]
      required_patterns:
        - '"column":\s*"(any\.|root\.)'
      anti_patterns: []
      tool_ordering:
        - [get_workspace_context, run_query]
    expected_skills:
      - query-patterns
    config:
      max_turns: 20
      timeout_ms: 300000

  - id: workflow-service-dependencies
    name: "Service dependency mapping with health check"
    comparison: true
    prompt: "Use Honeycomb to map out the service dependencies in production and identify any unhealthy connections"
    expected:
      required_tools: [get_workspace_context, get_service_map, run_query]
      recommended_tools: [find_columns]
      required_patterns: []
      anti_patterns: []
      tool_ordering:
        - [get_workspace_context, get_service_map]
    expected_skills:
      - production-investigation
    config:
      max_turns: 15
      timeout_ms: 300000

  # --- Result interpretation ---

  - id: interpret-bimodal-latency
    name: "Recognize bimodal latency signal and confirm with HEATMAP"
    comparison: true
    prompt: "Some checkout requests are fast but others are really slow — why are some requests taking so much longer than others?"
    expected:
      required_tools: [get_workspace_context, run_query]
      recommended_tools: [run_bubbleup, get_trace]
      required_patterns:
        - '"op":\s*"HEATMAP"'
      anti_patterns:
        - '"op":\s*"AVG",\s*"column":\s*"duration'
      tool_ordering:
        - [get_workspace_context, run_query]
    expected_skills:
      - query-patterns
    config:
      max_turns: 20
      timeout_ms: 300000

  - id: interpret-result-chaining
    name: "Chain query → BubbleUp → trace from a vague anomaly report"
    comparison: true
    prompt: "Checkout latency is spiking and I don't know why — can you find the root cause?"
    expected:
      required_tools: [get_workspace_context, run_query, run_bubbleup]
      recommended_tools: [get_trace]
      required_patterns:
        - '"op":\s*"(HEATMAP|P99|P95|P90)"'
      anti_patterns: []
      tool_ordering:
        - [get_workspace_context, run_query]
        - [run_query, run_bubbleup]
    expected_skills:
      - production-investigation
      - query-patterns
    config:
      max_turns: 25
      timeout_ms: 360000

  # --- SLO and reliability ---

  - id: slo-budget-burn-investigation
    name: "SLO budget burn: drill from triggered SLO into root cause"
    comparison: true
    prompt: "Our checkout SLO is in trouble — I think we got a burn alert. Can you figure out what's eating the error budget and whether we need to page someone?"
    expected:
      required_tools: [get_workspace_context, get_slos, run_query]
      recommended_tools: [run_bubbleup, get_trace, get_triggers]
      required_patterns: []
      anti_patterns:
        - "I don't have access to SLO"
        - "I cannot check SLO"
      tool_ordering:
        - [get_workspace_context, get_slos]
        - [get_slos, run_query]
    expected_skills:
      - slos-and-triggers
      - production-investigation
    config:
      max_turns: 20
      timeout_ms: 300000

  - id: slo-vs-triggers-health-check
    name: "Cross-reference SLOs and triggers for overall reliability posture"
    comparison: true
    prompt: "I'm starting on-call for the demo environment. Give me a full reliability picture — which SLOs are healthy, which are at risk, and are any alerts actively firing?"
    expected:
      required_tools: [get_workspace_context, get_slos, get_triggers]
      recommended_tools: [run_query, get_service_map]
      required_patterns: []
      anti_patterns:
        - "I don't have access to triggers"
        - "I cannot check triggers"
      tool_ordering:
        - [get_workspace_context, get_slos]
        - [get_workspace_context, get_triggers]
    expected_skills:
      - slos-and-triggers
    config:
      max_turns: 20
      timeout_ms: 300000
