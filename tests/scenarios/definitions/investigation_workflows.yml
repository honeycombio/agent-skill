scenarios:
  # === Multi-step investigation workflows ===
  # Tests complex, multi-tool investigation patterns that differentiate
  # plugin-guided behavior from bare MCP usage.

  # --- Existing workflows (modified) ---

  - id: workflow-full-investigation
    name: "Full investigation workflow: prime, discover, query, analyze"
    comparison: true
    prompt: "We're seeing a latency spike in production. Investigate what's causing it and find the root cause."
    expected:
      required_tools: [get_workspace_context, run_query]
      recommended_tools: [find_columns, run_bubbleup, get_trace]
      required_patterns:
        - '"op":\s*"(HEATMAP|P99|P95|P90)"'
      anti_patterns: []
      tool_ordering:
        - [get_workspace_context, run_query]
    expected_skills:
      - production-investigation
      - query-patterns
    config:
      max_turns: 20
      timeout_ms: 300000

  - id: workflow-slo-investigation
    name: "SLO-driven investigation"
    comparison: true
    prompt: "Check our SLOs and tell me which ones are burning budget — then dig into the worst one and find out what's causing it"
    expected:
      required_tools: [get_workspace_context, get_slos, run_query]
      recommended_tools: [run_bubbleup, get_trace]
      required_patterns: []
      anti_patterns: []
      tool_ordering:
        - [get_workspace_context, get_slos]
        - [get_slos, run_query]
    expected_skills:
      - slos-and-triggers
    config:
      max_turns: 15
      timeout_ms: 300000

  - id: workflow-service-dependencies
    name: "Service dependency mapping with health check"
    comparison: true
    prompt: "Map out the service dependencies in production and identify any unhealthy connections"
    expected:
      required_tools: [get_workspace_context, get_service_map, run_query]
      recommended_tools: [find_columns]
      required_patterns: []
      anti_patterns: []
      tool_ordering:
        - [get_workspace_context, get_service_map]
    expected_skills:
      - production-investigation
    config:
      max_turns: 15
      timeout_ms: 300000

  # --- New complex investigation scenarios ---

  - id: investigation-cascading-failure
    name: "Cascading failure investigation from vague user report"
    comparison: true
    prompt: "Users are complaining that the site is broken — pages are timing out and checkout isn't working. Can you figure out what's going on?"
    expected:
      required_tools: [get_workspace_context, run_query]
      recommended_tools: [get_service_map, run_bubbleup, get_trace]
      required_patterns:
        - '"op":\s*"(HEATMAP|P99|P95|P90)"'
        - '"column":\s*"error"'
      anti_patterns:
        - '"op":\s*"AVG",\s*"column":\s*"duration'
      tool_ordering:
        - [get_workspace_context, run_query]
    expected_skills:
      - production-investigation
      - query-patterns
    config:
      max_turns: 20
      timeout_ms: 300000

  - id: investigation-bubbleup-latency
    name: "Latency investigation using BubbleUp workflow"
    comparison: true
    prompt: "Checkout has gotten really slow in the last couple hours but I can't tell why — it's not all requests, just some of them are taking forever. Help me figure out what's different about the slow ones."
    expected:
      required_tools: [get_workspace_context, run_query]
      recommended_tools: [run_bubbleup, get_trace]
      required_patterns:
        - '"op":\s*"HEATMAP"'
      anti_patterns:
        - '"op":\s*"AVG",\s*"column":\s*"duration'
      tool_ordering:
        - [get_workspace_context, run_query]
    expected_skills:
      - production-investigation
      - query-patterns
    config:
      max_turns: 20
      timeout_ms: 300000

  - id: investigation-cross-service-errors
    name: "Cross-service error correlation using relational fields"
    comparison: true
    prompt: "The recommendation service is throwing database timeout errors — I need to understand which user-facing endpoints are affected and how bad the impact is on real users."
    expected:
      required_tools: [get_workspace_context, run_query]
      recommended_tools: [get_trace, get_service_map]
      required_patterns:
        - '"column":\s*"(any\.|root\.)'
      anti_patterns: []
      tool_ordering:
        - [get_workspace_context, run_query]
    expected_skills:
      - query-patterns
    config:
      max_turns: 20
      timeout_ms: 300000

  - id: slo-budget-burn-investigation
    name: "SLO budget burn: drill from triggered SLO into root cause"
    comparison: true
    prompt: "Our checkout SLO is in trouble — I think we got a burn alert. Can you figure out what's eating the error budget and whether we need to page someone?"
    expected:
      required_tools: [get_workspace_context, get_slos, run_query]
      recommended_tools: [run_bubbleup, get_trace, get_triggers]
      required_patterns: []
      anti_patterns:
        - "I don't have access to SLO"
        - "I cannot check SLO"
      tool_ordering:
        - [get_workspace_context, get_slos]
        - [get_slos, run_query]
    expected_skills:
      - slos-and-triggers
      - production-investigation
    config:
      max_turns: 20
      timeout_ms: 300000

  - id: slo-vs-triggers-health-check
    name: "Cross-reference SLOs and triggers for overall reliability posture"
    comparison: true
    prompt: "I'm starting on-call for the demo environment. Give me a full reliability picture — which SLOs are healthy, which are at risk, and are any alerts actively firing? Tell me what I should keep an eye on."
    expected:
      required_tools: [get_workspace_context, get_slos, get_triggers]
      recommended_tools: [run_query, get_service_map]
      required_patterns: []
      anti_patterns:
        - "I don't have access to triggers"
        - "I cannot check triggers"
      tool_ordering:
        - [get_workspace_context, get_slos]
        - [get_workspace_context, get_triggers]
    expected_skills:
      - slos-and-triggers
    config:
      max_turns: 20
      timeout_ms: 300000

  - id: broken-slo-diagnosis
    name: "Diagnose a broken SLO with 0% compliance and negative budget"
    comparison: true
    prompt: "One of our SLOs is showing something weird — I think the compliance is at 0% or the budget is deeply negative. Can you figure out what's going on with it and whether the SLO itself is misconfigured or if there's a real problem?"
    expected:
      required_tools: [get_workspace_context, get_slos]
      recommended_tools: [run_query, find_columns, get_dataset_columns]
      required_patterns: []
      anti_patterns:
        - "I don't have access to SLO"
        - "all SLOs are healthy"
      tool_ordering:
        - [get_workspace_context, get_slos]
    expected_skills:
      - slos-and-triggers
    config:
      max_turns: 20
      timeout_ms: 300000
