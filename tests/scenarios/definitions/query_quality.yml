scenarios:
  - id: query-percentiles-for-latency
    name: "Uses percentiles for latency, not AVG"
    prompt: "Show me the latency of my API endpoints in production over the last hour"
    expected:
      required_tools: [get_workspace_context, run_query]
      recommended_tools: [find_columns]
      required_patterns:
        - '"op":\s*"P(99|95|90|50)"'
      anti_patterns:
        - '"op":\s*"AVG",\s*"column":\s*"duration'
      tool_ordering:
        - [get_workspace_context, run_query]
    config:
      max_turns: 8
      timeout_ms: 120000

  - id: query-heatmap-distribution
    name: "Uses HEATMAP for distribution analysis"
    prompt: "I want to see the distribution of request durations in production — are there bimodal patterns?"
    expected:
      required_tools: [get_workspace_context, run_query]
      recommended_tools: []
      required_patterns:
        - '"op":\s*"HEATMAP"'
      anti_patterns: []
      tool_ordering:
        - [get_workspace_context, run_query]
    config:
      max_turns: 8
      timeout_ms: 120000

  - id: query-context-priming
    name: "Primes context before querying"
    prompt: "Count errors by service in production over the last 24 hours"
    expected:
      required_tools: [get_workspace_context, run_query]
      recommended_tools: [find_columns]
      required_patterns:
        - '"op":\s*"COUNT"'
        - '"column":\s*"error"'
      anti_patterns: []
      tool_ordering:
        - [get_workspace_context, run_query]
    config:
      max_turns: 8
      timeout_ms: 120000

  - id: query-relational-fields
    name: "Uses relational field prefixes for cross-service queries"
    prompt: "Find traces where the root span is from the API gateway and any downstream service has errors"
    expected:
      required_tools: [get_workspace_context, run_query]
      recommended_tools: [find_columns]
      required_patterns:
        - '"column":\s*"(root\.|any\.)'
      anti_patterns: []
      tool_ordering:
        - [get_workspace_context, run_query]
    config:
      max_turns: 8
      timeout_ms: 120000

  - id: query-human-readable-time
    name: "Uses human-readable time ranges"
    prompt: "Show me the error rate over the last 6 hours"
    expected:
      required_tools: [get_workspace_context, run_query]
      recommended_tools: []
      required_patterns:
        - '"time_range":\s*"'
      anti_patterns:
        - '"time_range":\s*\d{5,}'
      tool_ordering:
        - [get_workspace_context, run_query]
    config:
      max_turns: 8
      timeout_ms: 120000

  - id: query-combined-operations
    name: "Combines multiple calculations in one query"
    prompt: "Give me a full picture of API performance — count, latency percentiles, and the distribution"
    expected:
      required_tools: [get_workspace_context, run_query]
      recommended_tools: []
      required_patterns:
        - '"op":\s*"COUNT"'
        - '"op":\s*"P(99|95|90)"'
      anti_patterns: []
      tool_ordering:
        - [get_workspace_context, run_query]
    config:
      max_turns: 8
      timeout_ms: 120000
